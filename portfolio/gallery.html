<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery | Your Name</title>
    <meta name="description" content="Motivation video and photo gallery." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <a class="visually-hidden-focusable skip-link" href="#main"
      >Skip to main content</a
    >
    <nav class="navbar navbar-expand-md sticky-top site-nav">
      <div class="container">
        <a class="navbar-brand" href="index.html">Your Name</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto gap-md-2">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="gallery.html"
                >Gallery</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main id="main">
      <header class="page-head">
        <div class="container">
          <h1>Gallery</h1>
          <p class="lead">
            A short video about why I study Computer Science, and some moments
            from my journey.
          </p>
        </div>
      </header>

      <!-- VIDEO -->
      <section class="section pt-0">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-9">
              <h2 class="section-title">Why I chose Computer Science</h2>
              <figure class="video-wrap mb-0">
                <div class="ratio ratio-16x9">
                  <video
                    controls
                    preload="metadata"
                    poster="images/video-poster.svg"
                  >
                    <source src="video/motivation.mp4" type="video/mp4" />
                    <p>
                      Your browser does not support HTML5 video.
                      <a href="video/motivation.mp4">Download the video</a>
                      instead.
                    </p>
                  </video>
                </div>
                <!--
              YouTube option (instead of the <video> above):
              <div class="ratio ratio-16x9">
                <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID" title="Why I chose Computer Science" allowfullscreen></iframe>
              </div>
            -->
                <figcaption>
                  My self-motivation video: what drives me to study Computer
                  Science and what I hope to achieve with it.
                </figcaption>
              </figure>
            </div>
          </div>
        </div>
      </section>

      <!-- PHOTOS -->
      <section class="section alt">
        <div class="container">
          <h2 class="section-title">Photos</h2>
          <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
            <div class="col">
              <figure class="photo h-100">
                <button
                  type="button"
                  class="photo-btn"
                  data-bs-toggle="modal"
                  data-bs-target="#photoModal"
                  data-src="images/headshot.svg"
                  data-caption="Professional headshot: Professional headshot taken for my student profile."
                  aria-label="Enlarge photo: Professional headshot"
                >
                  <img
                    src="images/headshot.svg"
                    class="img-fluid"
                    alt="Professional headshot"
                    width="800"
                    height="600"
                    loading="lazy"
                  />
                </button>
                <figcaption>
                  <strong>Professional headshot</strong
                  ><span
                    >Professional headshot taken for my student profile.</span
                  >
                </figcaption>
              </figure>
            </div>
            <div class="col">
              <figure class="photo h-100">
                <button
                  type="button"
                  class="photo-btn"
                  data-bs-toggle="modal"
                  data-bs-target="#photoModal"
                  data-src="images/campus.svg"
                  data-caption="Campus life: Studying with classmates on campus."
                  aria-label="Enlarge photo: Campus life"
                >
                  <img
                    src="images/campus.svg"
                    class="img-fluid"
                    alt="Campus life"
                    width="800"
                    height="600"
                    loading="lazy"
                  />
                </button>
                <figcaption>
                  <strong>Campus life</strong
                  ><span>Studying with classmates on campus.</span>
                </figcaption>
              </figure>
            </div>
            <div class="col">
              <figure class="photo h-100">
                <button
                  type="button"
                  class="photo-btn"
                  data-bs-toggle="modal"
                  data-bs-target="#photoModal"
                  data-src="images/workshop.svg"
                  data-caption="Coding workshop: Taking part in a hands-on Java workshop."
                  aria-label="Enlarge photo: Coding workshop"
                >
                  <img
                    src="images/workshop.svg"
                    class="img-fluid"
                    alt="Coding workshop"
                    width="800"
                    height="600"
                    loading="lazy"
                  />
                </button>
                <figcaption>
                  <strong>Coding workshop</strong
                  ><span>Taking part in a hands-on Java workshop.</span>
                </figcaption>
              </figure>
            </div>
            <div class="col">
              <figure class="photo h-100">
                <button
                  type="button"
                  class="photo-btn"
                  data-bs-toggle="modal"
                  data-bs-target="#photoModal"
                  data-src="images/project1.svg"
                  data-caption="Project: bank app: Console output of my Java banking program."
                  aria-label="Enlarge photo: Project: bank app"
                >
                  <img
                    src="images/project1.svg"
                    class="img-fluid"
                    alt="Project: bank app"
                    width="800"
                    height="600"
                    loading="lazy"
                  />
                </button>
                <figcaption>
                  <strong>Project: bank app</strong
                  ><span>Console output of my Java banking program.</span>
                </figcaption>
              </figure>
            </div>
            <div class="col">
              <figure class="photo h-100">
                <button
                  type="button"
                  class="photo-btn"
                  data-bs-toggle="modal"
                  data-bs-target="#photoModal"
                  data-src="images/project2.svg"
                  data-caption="Project: portfolio: Early layout sketch of this portfolio website."
                  aria-label="Enlarge photo: Project: portfolio"
                >
                  <img
                    src="images/project2.svg"
                    class="img-fluid"
                    alt="Project: portfolio"
                    width="800"
                    height="600"
                    loading="lazy"
                  />
                </button>
                <figcaption>
                  <strong>Project: portfolio</strong
                  ><span>Early layout sketch of this portfolio website.</span>
                </figcaption>
              </figure>
            </div>
            <div class="col">
              <figure class="photo h-100">
                <button
                  type="button"
                  class="photo-btn"
                  data-bs-toggle="modal"
                  data-bs-target="#photoModal"
                  data-src="images/hackathon.svg"
                  data-caption="Team challenge: Working with my team during a coding challenge."
                  aria-label="Enlarge photo: Team challenge"
                >
                  <img
                    src="images/hackathon.svg"
                    class="img-fluid"
                    alt="Team challenge"
                    width="800"
                    height="600"
                    loading="lazy"
                  />
                </button>
                <figcaption>
                  <strong>Team challenge</strong
                  ><span>Working with my team during a coding challenge.</span>
                </figcaption>
              </figure>
            </div>
          </div>
        </div>
      </section>

      <!-- LIGHTBOX -->
      <div
        class="modal fade"
        id="photoModal"
        tabindex="-1"
        aria-label="Enlarged photo"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-body p-0">
              <img src="" id="photoModalImg" class="img-fluid w-100" alt="" />
            </div>
            <div class="modal-footer justify-content-between">
              <span id="photoModalCaption"></span>
              <button
                type="button"
                class="btn btn-ink btn-sm"
                data-bs-dismiss="modal"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="row gy-3 align-items-center">
          <div class="col-md-4">
            <p class="mb-0">&copy; 2026 Your Name. All rights reserved.</p>
          </div>
          <div class="col-md-4">
            <nav class="footer-links" aria-label="Footer">
              <a href="index.html">Home</a> <a href="about.html">About</a>
              <a href="gallery.html">Gallery</a>
              <a href="contact.html">Contact</a>
            </nav>
          </div>
          <div class="col-md-4 text-md-end">
            <a
              href="https://github.com/your-username"
              aria-label="GitHub"
              class="social"
              ><i class="bi bi-github"></i
            ></a>
            <a
              href="https://www.linkedin.com/in/your-username"
              aria-label="LinkedIn"
              class="social"
              ><i class="bi bi-linkedin"></i
            ></a>
            <a
              href="mailto:your.name@university.ac.ug"
              aria-label="Email"
              class="social"
              ><i class="bi bi-envelope-fill"></i
            ></a>
            <a
              href="https://x.com/your-username"
              aria-label="X (Twitter)"
              class="social"
              ><i class="bi bi-twitter-x"></i
            ></a>
          </div>
        </div>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
